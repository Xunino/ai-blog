# =============================================================
# Nginx server block mau cho blog tinh.
#
# Cai dat:
#   sudo cp nginx.conf /etc/nginx/sites-available/blog
#   sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Nho doi: server_name, root, va duong dan chung chi SSL.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Chuyen het sang HTTPS (bo comment sau khi da co chung chi)
    # return 301 https://$host$request_uri;

    root /var/www/blog;
    index index.html;

    # ---------- Nen ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Brotli nen tot hon gzip ~15-20%.
    # Chi bat neu Nginx cua ban co module ngx_brotli.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json
    #              application/xml application/rss+xml image/svg+xml;

    # ---------- Dinh tuyen ----------
    # trailingSlash: 'always' + build.format: 'directory'
    # -> moi trang la mot thu muc chua index.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # ---------- Cache ----------
    # File trong /_astro/ co hash trong ten -> cache vinh vien
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Chi muc tim kiem cung co hash
    location /pagefind/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }

    # HTML khong cache — de nguoi doc luon thay ban moi nhat
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # RSS va sitemap: cache ngan
    location ~* \.(xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Anh, font trong public/
    location ~* \.(svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- Bao mat ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Chan truy cap file an
    location ~ /\. {
        deny all;
    }
}

# =============================================================
